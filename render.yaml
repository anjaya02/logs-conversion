services:
  - type: web
    name: logs-conversion
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true

cron:
  - name: keepalive
    schedule: "*/10 * * * *" # every 10 minutes
    command: curl -s https://logs-conversion.onrender.com/health > /dev/null
